name: Check blog

on:
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro and TypeScript
        run: pnpm run check
      - name: Build and verify draft exclusion
        run: pnpm run test:drafts
      - name: Verify legacy routes and content
        run: pnpm test
